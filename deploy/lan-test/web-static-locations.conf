# Include INSIDE the project server block when preparing a new immutable release.
# Keep the existing API/auth proxy and same-origin headers. Do not apply to shared services.
# REPLACE the old static locations; adding duplicate locations alongside them is invalid.
# Replace existing same-named security-header/gzip directives too; do not emit duplicate headers.
# Requires Nginx >= 1.29.3; preserve parent security headers when adding cache headers.
add_header_inherit merge;
# CSP permits Element Plus inline styles and original/blob image previews; scripts stay same-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# Compress public static HTML/JS/CSS; do not add authenticated JSON or already-compressed photos.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/css application/javascript;
location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location = /startup.css {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location = /release-manifest.json {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location = /assets { rewrite ^ /index.html last; }
location = /assets/ { rewrite ^ /index.html last; }
location /assets/ {
    # Only successful hash-named build files receive long-lived caching; missing files stay 404.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location / { try_files $uri $uri/ /index.html; }
