# Include INSIDE the project server block when preparing a new immutable release.
# Keep the existing API/auth proxy and same-origin headers. Do not apply to shared services.
# REPLACE the old static locations; adding duplicate locations alongside them is invalid.
# Requires Nginx >= 1.29.3; preserve parent security headers when adding cache headers.
add_header_inherit merge;
location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location = /startup.css {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location = /release-manifest.json {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location = /assets { rewrite ^ /index.html last; }
location = /assets/ { rewrite ^ /index.html last; }
location /assets/ {
    # Only successful hash-named build files receive long-lived caching; missing files stay 404.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location / { try_files $uri $uri/ /index.html; }
