<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOP 功能页原型对照</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.6 "Microsoft YaHei",sans-serif;background:#f4f7fc;color:#293d57}header{padding:18px 24px;background:#fff;border-bottom:1px solid #dce6f2;position:sticky;top:0;z-index:2}h1{font-size:19px;margin:0 0 8px}p{margin:6px 0;color:#708198;font-size:12px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}select{padding:8px 10px;border:1px solid #cbd9eb;border-radius:5px;background:#fff;min-width:230px}main{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}section{min-width:0;background:#fff;border:1px solid #dce6f2;border-radius:6px;overflow:hidden}h2{font-size:13px;font-weight:500;margin:0;padding:12px 16px;background:#f8fbff;border-bottom:1px solid #e4ecf7}img{display:block;width:100%;height:auto}a{color:#2878e8;text-decoration:none}.foot{padding:10px 16px;font-size:12px}@media(max-width:850px){main{grid-template-columns:1fr}header{position:static}}</style><header><h1>逐功能原型与当前实现对照</h1><div class="controls"><select id="page" aria-label="选择功能页"></select><select id="width" aria-label="当前实现视口"><option value="1440">桌面 1440px</option><option value="390">手机 390px</option></select></div><p>左侧为本地原型的演示数据；右侧为接入真实测试API的当前页面。部分业务页参考同类原型布局，缺失指标保持未知。</p></header><main><section><h2>原型参考 · 桌面布局</h2><a id="ref-link" target="_blank"><img id="ref" alt="原型页面截图"></a></section><section><h2 id="current-title">当前实现</h2><a id="current-link" target="_blank"><img id="current" alt="当前实现截图"></a><div class="foot" id="route"></div></section></main><script>const entries=[{"title":"资产管理","path":"/assets","reference":"assets"},{"title":"运营总览","path":"/dashboard","reference":"dashboard"},{"title":"网络监控","path":"/network-monitoring","reference":"platform-health"},{"title":"报障与受理","path":"/tickets","reference":"tickets"},{"title":"手工来源登记","path":"/manual-incidents","reference":"incidents"},{"title":"SLA对照","path":"/sla-scenarios","reference":"sla"},{"title":"台账导出","path":"/asset-export-jobs","reference":"reports"},{"title":"导出消息","path":"/my-export-messages","reference":"reports"},{"title":"本人工时","path":"/my-worklogs","reference":"tickets"},{"title":"通知偏好","path":"/my-notification-preferences","reference":"notifications"},{"title":"备份计划","path":"/backup-plan-drafts","reference":"backups"},{"title":"变更报备","path":"/change-notice-drafts","reference":"backups"},{"title":"巡检模板","path":"/inspection-templates","reference":"templates"},{"title":"巡检执行单","path":"/inspection-worksheets","reference":"reports"},{"title":"巡检来源集合","path":"/inspection-source-collections","reference":"reports"},{"title":"租户登记","path":"/tenant-inventory","reference":"tenants"},{"title":"联系人","path":"/customer-contacts","reference":"tenants"},{"title":"联系人导入","path":"/contact-imports","reference":"onboarding"},{"title":"导入预览","path":"/contact-import-preview","reference":"onboarding"},{"title":"经营对照","path":"/operational-comparison","reference":"operations"},{"title":"容量估算","path":"/capacity-estimates","reference":"capacity"},{"title":"用户管理","path":"/identity/users","reference":"members"},{"title":"角色权限","path":"/identity/roles","reference":"members"},{"title":"身份设置","path":"/identity/settings","reference":"members"},{"title":"我的账号","path":"/account","reference":"members"},{"title":"配置确认","path":"/configurations","reference":"templates"},{"title":"阈值诊断","path":"/threshold-diagnostics","reference":"alert-rules"},{"title":"能力目录","path":"/capability-catalog","reference":"members"},{"title":"审计日志","path":"/audit","reference":"audit"},{"title":"登录","path":"/login","reference":"login"}];const page=document.getElementById("page"),width=document.getElementById("width");entries.forEach((x,i)=>{const o=document.createElement("option");o.value=i;o.textContent=x.title;page.append(o)});function render(){const x=entries[Number(page.value)],ref="reference-"+x.reference+".png",current="after-"+x.path.slice(1).replaceAll("/","-")+"-"+width.value+".png";document.getElementById("ref").src=ref;document.getElementById("ref-link").href=ref;document.getElementById("current").src=current;document.getElementById("current-link").href=current;document.getElementById("current-title").textContent="当前实现 · "+x.title;document.getElementById("route").textContent=x.path}page.onchange=width.onchange=render;render();</script></html>
