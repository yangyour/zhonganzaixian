server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: MOP_SESSION
        http-only: true
        same-site: strict
        secure: false
spring:
  servlet:
    multipart:
      max-file-size: 20971520B
      max-request-size: 22020096B
  profiles:
    default: remote_test
  jackson:
    parser:
      strict-duplicate-detection: true
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
  main:
    banner-mode: "off"
logging:
  level:
    org.springframework.security: WARN
