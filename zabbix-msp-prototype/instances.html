<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>监控资源池 · MSP 托管运维平台</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/enterprise.css?v=20260929-layout-3">
</head>
<body>
<div id="app"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/contract-model.js?v=20260929-reference-2"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/shell.js?v=20260929-reference-2"></script>
<script>
App.page('instances', (root, ctx) => {
  const { fmt, esc, icon } = App;
  const pools = DATA.pools;
  const stat = (p) => p.status === 'ok' ? App.badge('ok', '正常', true) : p.status === 'warn' ? App.badge('warn', '注意', true) : App.badge('neutral', '预留 / 待启用');
  root.innerHTML = `
  <div class="page-head"><div><h1>监控资源池 <span class="muted small">${pools.length} 个 Zabbix 实例</span></h1><div class="sub">每个资源池包含一套 Zabbix 实例（API 前端 × 2、Server 主备、独立 PostgreSQL / TimescaleDB），可承载多个标准租户或独享给单个客户。各池不共享数据库；所有 Zabbix ID 按字符串处理，唯一性包含 instance_id。</div></div>
    <div class="page-actions"><button class="btn" id="bom">${icon('file-text')} 版本兼容矩阵 / BOM</button><button class="btn primary" id="newPool">${icon('plus')} 新建资源池</button></div></div>
  <div class="grid g5 mb">
    ${App.kpi({ label: '资源池', value: pools.length, sub: `${pools.filter(p => p.type === 'shared').length} 共享 · ${pools.filter(p => p.type === 'dedicated').length} 独享` })}
    ${App.kpi({ label: '总 NVPS / 容量', value: fmt.n(pools.reduce((s, p) => s + p.nvps, 0)), sub: `容量 ${fmt.n(pools.reduce((s, p) => s + p.nvpsCap, 0))} · 目标 12,500 待压测` })}
    ${App.kpi({ label: '主机 / Item', value: fmt.n(pools.reduce((s, p) => s + p.hosts, 0)), sub: `${fmt.compact(pools.reduce((s, p) => s + p.items, 0))} Item` })}
    ${App.kpi({ label: '监控库总量', value: fmt.n(pools.reduce((s, p) => s + p.db.size, 0) / 1e12, 2), unit: 'TB', sub: `容量 ${fmt.n(pools.reduce((s, p) => s + p.db.cap, 0) / 1e12, 1)} TB · 未压缩估算` })}
    ${App.kpi({ label: '版本基线', value: '7.0 LTS', sub: '7.0.12–7.0.13 · 全面支持至 2027-06-30', help: '8.0 LTS 为计划版本，不能因发布日期临近就认定可用' })}
  </div>
  <div class="grid g2 mb">${pools.map(p => `<div class="card" style="cursor:pointer" onclick="location.href='instances.html?id=${p.id}'"><div class="card-head"><h3>${icon('database')} ${esc(p.name)} <span class="sub mono">${p.id}</span></h3><div class="row" style="gap:6px">${App.badge(p.type === 'shared' ? 'neutral' : 'primary', p.type === 'shared' ? '共享' : '独享')}${stat(p)}</div></div><div class="card-body">
    <div class="grid g4 mb" style="gap:10px"><div class="kv-card"><div class="l">Zabbix</div><div class="v">${p.version}</div></div><div class="kv-card"><div class="l">HA 活动 / 备用</div><div class="v small">${p.ha.active}<br><span class="muted">${p.ha.standby}</span></div></div><div class="kv-card"><div class="l">NVPS</div><div class="v">${fmt.n(p.nvps)} <span class="muted small">/ ${fmt.n(p.nvpsCap)}</span></div></div><div class="kv-card"><div class="l">监控库</div><div class="v">${fmt.n(p.db.size / 1e12, 2)} TB <span class="muted small">/ ${fmt.n(p.db.cap / 1e12, 1)}</span></div></div></div>
    <div class="row between xs muted mb8"><span>池负载（NVPS）</span><span>${fmt.pct(p.nvps / p.nvpsCap * 100, 0)}</span></div>${App.meter(p.nvps / p.nvpsCap * 100, null, true)}
    <div class="row between xs muted mt8 mb8"><span>租户占比</span><span>${p.tenants.length} 租户 · ${p.hosts} 主机</span></div>
    <div class="stack-bar">${p.tenants.map((tid, i) => { const t = App.tenantObj(tid); return `<i style="width:${t.nvps / Math.max(1, p.nvps) * 100}%;background:${Charts.PALETTE[i]}" title="${esc(t.name)} ${fmt.pct(t.nvps / p.nvps * 100, 0)}"></i>`; }).join('') || '<i style="width:100%;background:#e2e8f0"></i>'}</div>
    <div class="legend mt8">${p.tenants.map((tid, i) => { const t = App.tenantObj(tid); const share = t.nvps / p.nvps * 100; return `<span><i style="background:${Charts.PALETTE[i]}"></i>${esc(t.name)} ${fmt.pct(share, 0)}${p.type === 'shared' && share > 60 ? ' <span class="delta bad">超 20% 线</span>' : ''}</span>`; }).join('') || '<span class="muted">暂无租户</span>'}</div>
    <div class="row between xs muted mt"><span>队列 5s / 10s / 5m / 10m+：<b class="mono">${p.queue['5s']} / ${p.queue['10s']} / ${p.queue['5m']} / ${p.queue['10m+']}</b></span><span>写延迟 ${p.db.writeLat} ms · 复制延迟 <b class="${p.db.replicaLag > 10 ? 'delta bad' : ''}">${p.db.replicaLag} s</b></span></div>
    <div class="row between xs muted mt8"><span>备份 ${fmt.ago(p.backup.last)} · 恢复演练 ${p.backup.ok ? fmt.ago(p.backup.rtoTest) : '<span class="delta bad">' + fmt.ago(p.backup.rtoTest) + '（超 90 天）</span>'}</span><span>升级窗口 ${esc(p.upgradeWindow)}</span></div>
  </div></div>`).join('')}</div>
  <div class="grid g-2-1" style="align-items:start">
    <div class="card"><div class="card-head"><h3>NVPS 趋势 <span class="sub">7 天 · 按池</span></h3></div><div class="card-body" id="nvpsChart"></div></div>
    <div class="card"><div class="card-head"><h3>性能优化的先后顺序</h3></div><div class="card-body flush"><table class="table dense"><thead><tr><th>观察信号</th><th>先采取的动作</th></tr></thead><tbody>${[['不支持的 Item、发现膨胀', '修复模板、收敛 LLD、降低无价值高频采样'], ['Proxy 队列 / 延迟上升', '查网络、慢检查、本地磁盘；按站点和协议拆分采集'], ['预处理 / Server 队列积压', '检查重型正则 / 脚本、依赖指标、处理进程与缓存'], ['DB 写延迟 / WAL / IOPS', '独立高性能存储，审查索引、保留周期、检查点'], ['大屏拖慢 API', '缓存、限曲线 / 点数、趋势聚合、异步报告'], ['单租户占据大部分资源', '租户配额、Worker 公平调度；> 20% 评审迁独享池']].map(r => `<tr><td class="small">${r[0]}</td><td class="xs muted">${r[1]}</td></tr>`).join('')}</tbody></table><div class="xs muted" style="padding:8px 18px">不要用「新增 Server 备用节点」替代拆分监控实例：原生 HA 每次只有一个活动节点，不提高吞吐。</div></div></div>
  </div>`;
  Charts.line(document.getElementById('nvpsChart'), { height: 230, x: DATA.ts(1, { hours: 168, points: 84 }).x, series: pools.filter(p => p.nvps).map((p, i) => ({ name: p.id, data: DATA.ts(900 + i, { hours: 168, points: 84, base: p.nvps, amp: p.nvps * .12, noise: p.nvps * .04, min: 0 }).y })), smooth: true, dots: false, yFormat: v => fmt.compact(v), thresholds: [{ value: 5000, label: '共享池容量', color: '#f59e0b' }] });
  if (App.qs('id')) { const p = pools.find(x => x.id === App.qs('id')); if (p) App.drawer({ title: p.name, sub: `${p.id} · ${p.region} · Zabbix ${p.version}`, width: 720, body: `
    <div class="row wrap mb" style="gap:8px">${App.badge(p.type === 'shared' ? 'neutral' : 'primary', p.type === 'shared' ? '共享池' : '独享池')}${stat(p)}<span class="badge neutral">API 前端 × ${p.frontends}</span><span class="badge neutral">Proxy × ${p.proxies}</span><span class="badge neutral">保留 ${p.retention.history}d / ${p.retention.trends}d</span></div>
    <div class="tabs plain mb" data-group="d" style="border-bottom:1px solid var(--line)"><button data-tab="topo" class="active">拓扑与 HA</button><button data-tab="db">数据库</button><button data-tab="tenants">租户</button><button data-tab="ops">升级 / 迁移 / 回退</button></div>
    <div class="tab-panel active" data-group="d" data-panel="topo"><div class="status-grid">${[['API 前端 zbx-fe-01', 'ok', 'JSON-RPC · Bearer · P95 ' + p.apiP95 + ' ms'], ['API 前端 zbx-fe-02', 'ok', '认证头转发正常'], ['Server ' + p.ha.active, 'ok', '活动节点 · 队列 10m+ = ' + p.queue['10m+']], ['Server ' + p.ha.standby, 'ok', '备用节点 · 心跳正常'], ['PostgreSQL 主', p.db.replicaLag > 10 ? 'warn' : 'ok', '写延迟 ' + p.db.writeLat + ' ms'], ['PostgreSQL 备', p.db.replicaLag > 10 ? 'warn' : 'ok', '复制延迟 ' + p.db.replicaLag + ' s']].map(c => `<div class="status-cell ${c[1]}"><div class="sc-head"><span class="small">${c[0]}</span>${App.badge(c[1] === 'ok' ? 'ok' : 'warn', c[1] === 'ok' ? '正常' : '注意', true)}</div><div class="xs muted">${c[2]}</div></div>`).join('')}</div><div class="callout neutral mt">${icon('info')}<div>Zabbix 原生 Server HA 共享同一个数据库，每次只有一个活动节点；故障转移时间取决于配置与外部数据库状态，不预先承诺「无损秒切」。${p.ha.lastFailover ? ' 上次切换：' + fmt.dt(p.ha.lastFailover) : ''}</div></div></div>
    <div class="tab-panel" data-group="d" data-panel="db"><dl class="kv cols2"><dt>引擎</dt><dd>${esc(p.db.engine)}</dd><dt>大小 / 容量</dt><dd>${fmt.n(p.db.size / 1e12, 2)} / ${fmt.n(p.db.cap / 1e12, 1)} TB</dd><dt>TimescaleDB 压缩</dt><dd>${p.db.compression} · 迟到数据超窗可能丢弃</dd><dt>保留（全局）</dt><dd>历史 ${p.retention.history} 天 · 趋势 ${p.retention.trends} 天</dd><dt>写延迟 P95</dt><dd>${p.db.writeLat} ms</dd><dt>复制延迟</dt><dd class="${p.db.replicaLag > 10 ? 'delta bad' : ''}">${p.db.replicaLag} s</dd><dt>最近备份</dt><dd>${fmt.ago(p.backup.last)} · RPO ${p.backup.rpoMin} 分钟（WAL）</dd><dt>恢复演练</dt><dd>${fmt.ago(p.backup.rtoTest)} ${p.backup.ok ? '' : '<span class="delta bad">超过 90 天</span>'}</dd></dl><div class="callout warn mt">${icon('alert-triangle')}<div>不同保留政策应拆池；Proxy 离线期限与压缩补传窗口必须一起验证；TimescaleDB 不用于 Proxy。</div></div></div>
    <div class="tab-panel" data-group="d" data-panel="tenants"><table class="table dense"><thead><tr><th>租户</th><th>主机</th><th>NVPS</th><th>占比</th><th>配额</th></tr></thead><tbody>${p.tenants.map(tid => { const t = App.tenantObj(tid); const share = t.nvps / p.nvps * 100; return `<tr><td>${esc(t.name)}</td><td class="num">${t.assets}</td><td class="num">${fmt.n(t.nvps)}</td><td class="num ${p.type === 'shared' && share > 60 ? 'delta bad' : ''}">${fmt.pct(share, 0)}</td><td class="num">${fmt.n(t.quota.nvps)}</td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">暂无租户</td></tr>'}</tbody></table></div>
    <div class="tab-panel" data-group="d" data-panel="ops"><ol class="stack small" style="gap:8px;padding-left:16px;list-style:decimal;color:var(--text-2)"><li><b>固定基线</b>：锁定 Zabbix / Proxy / Agent / DB / 扩展和模板版本；预生产验证 API 契约、权限矩阵、典型触发器与升级脚本。</li><li><b>灰度升级</b>：先选小型资源池（pool-south-01），明确写入窗口与 Proxy 缓冲；比较升级前后采集延迟、事件数量和图表结果。</li><li><b>回退准备</b>：升级前制作经验证的备份；schema 升级后不能假设回滚镜像即可恢复。</li><li><b>租户迁池</b>：新池资源 → 保留资产 ID → 校验绑定与凭据 → 双采抑制重复通知 → 逐站切换；旧历史只读路由到原池直至到期。</li></ol><div class="row mt" style="gap:8px"><button class="btn sm" onclick="App.toast('已创建升级计划：' + '${p.upgradeWindow}' + '，先在 pool-south-01 灰度','info')">${icon('upload')} 计划升级</button><button class="btn sm" onclick="App.toast('迁池向导已打开（原型演示）','info')">${icon('database')} 迁入租户</button></div></div>`, onOpen: (el) => App.tabs(el, 'd') }); }
  document.getElementById('bom').onclick = () => App.modal({ title: '版本兼容矩阵 / BOM', size: 'lg', body: `<table class="table dense"><thead><tr><th>组件</th><th>版本</th><th>兼容依据</th><th>镜像摘要</th><th>责任人</th></tr></thead><tbody>${[['Zabbix Server / Frontend', '7.0.13', '官方 7.0 LTS · 全面支持至 2027-06', 'sha256:3f1a…', '刘岚'], ['Zabbix Proxy', '7.0.12 / 7.0.13', '同代 Proxy；6.0.31（px-dg-01）未在矩阵内', 'sha256:8c02…', 'SRE'], ['Zabbix Agent 2', '7.0.x', '主机模板基线要求 ≥ 7.0.0', '—', 'SRE'], ['PostgreSQL', '16.4', 'Zabbix 7.0.13 支持矩阵', 'sha256:a9e1…', 'DBA'], ['TimescaleDB', '2.15.x', 'PoC 通过 · 压缩窗口 7 天', 'sha256:5b77…', 'DBA'], ['控制层 (Spring Boot)', '3.3 / Java 21', '内部', 'sha256:c1c1…', '后端'], ['RabbitMQ', '3.13', '仲裁队列', 'sha256:d2d2…', 'SRE']].map(r => `<tr><td>${r[0]}</td><td class="mono">${r[1]}</td><td class="xs muted">${r[2]}</td><td class="mono xs">${r[3]}</td><td class="small">${r[4]}</td></tr>`).join('')}</tbody></table><div class="xs muted mt8">不固定未经现场验证的第三方补丁号；立项时产出 BOM 记录版本、兼容性依据、镜像摘要、更新责任人及升级回退步骤。</div>` });
  document.getElementById('newPool').onclick = () => App.modal({ title: '新建资源池', body: `<div class="form-grid"><div class="field"><label>名称</label><input class="input" placeholder="例如 华北共享池 01"></div><div class="field"><label>类型</label><select class="select"><option>共享</option><option>独享（指定租户）</option></select></div><div class="field"><label>地域</label><select class="select"><option>华东（上海）</option><option>华南（广州）</option><option>华北（北京）</option></select></div><div class="field"><label>保留策略</label><select class="select"><option>历史 30d / 趋势 365d</option><option>历史 90d / 趋势 730d</option></select></div><div class="field"><label>起始规格</label><input class="input" value="Server 4C8G ×2 · PG 8C16G 主备 · FE ×2"></div><div class="field"><label>版本基线</label><input class="input" readonly value="Zabbix 7.0.13 · PG 16.4 · TSDB 2.15"></div></div>`, foot: `<button class="btn" data-close>取消</button><button class="btn primary" onclick="App.toast('资源池创建任务已提交（IaC 流水线）','ok');App.closeLayer()">创建</button>` });
});
</script>
</body>
</html>
