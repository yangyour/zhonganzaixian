<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>资产接入 · MSP 托管运维平台</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/enterprise.css?v=20260929-layout-3">
</head>
<body>
<div id="app"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/contract-model.js?v=20260929-reference-2"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/shell.js?v=20260929-reference-2"></script>
<script>
App.page('onboarding', (root, ctx) => {
  const { fmt, esc, icon } = App;
  const tenant = ctx.tenant.id === 'all' ? DATA.tenants[0] : ctx.tenant;
  const sites = DATA.sites.filter(s => s.tenant === tenant.id);
  const state = { step: 1, form: { cmdb: 'CI-20431', name: 'srv-erp-app-03', ip: '10.10.20.13', type: 'linux', site: sites[0].name, owner: '陈立', service: 'ERP 系统', tags: 'erp, prod, tier1', proxy: '', cred: 'psk', port: '10050', template: 'tp-01', interval: '60', macros: { '{$CPU.UTIL.CRIT}': '80', '{$VFS.FS.PUSED.MAX.WARN}': '80', '{$AGENT.NODATA_TIMEOUT}': '3m' }, escalation: '银牌', sla: 'ERP 系统' }, netcheck: null, verify: null, submitted: null };
  const STEPS = [['资产登记', 'CMDB ID · 租户 · 站点 · 负责人 · 服务关系'], ['分配采集', '网络检查 · Proxy 绑定 · 独立凭据'], ['套用模板', '版本 · 宏 · 采样周期 · 阈值'], ['验证首值', 'Agent 可达 · Item 有效 · 触发器正常'], ['进入服务', '计量 · 告警分派 · SLA 映射']];
  const pending = DATA.assets.filter(App.inScope).filter(a => a.sync !== 'active');

  function render() {
    const f = state.form; const s = state.step;
    root.innerHTML = `
    <div class="page-head"><div><h1>资产接入 <span class="badge primary">${esc(tenant.name)}</span></h1><div class="sub">接入流程：资产登记 → 分配采集 → 套用模板 → 验证首值 → 进入服务。提交后返回 202 + operation_id，前端显示「同步中 / 生效 / 失败」，不会提前宣布创建成功。</div></div>
      <div class="page-actions"><button class="btn" id="bulkImport">${icon('upload')} 批量导入（CSV / CMDB 同步）</button><button class="btn" id="autoReg">${icon('inbox')} 待认领区 <span class="badge warn" style="height:18px">3</span></button></div></div>
    <div class="grid g-3-2" style="align-items:start">
      <div class="card">
        <div class="card-body" style="padding:18px 22px 10px"><div class="stepper">${STEPS.map((x, i) => `<div class="step ${i + 1 < s ? 'done' : i + 1 === s ? 'active' : ''}"><span class="s-idx">${i + 1 < s ? icon('check') : i + 1}</span><div class="s-txt"><div class="s-title">${x[0]}</div><div class="s-sub">${x[1]}</div></div>${i < STEPS.length - 1 ? '<span class="s-line"></span>' : ''}</div>`).join('')}</div></div>
        <div class="card-body" id="stepBody" style="border-top:1px solid var(--line)"></div>
        <div class="card-foot" style="justify-content:space-between"><span class="xs">${s < 5 ? `步骤 ${s} / 5` : '完成后可在资产列表查看同步状态'}</span><div class="row"><button class="btn" id="prev" ${s === 1 || state.submitted ? 'disabled' : ''}>${icon('arrow-left')} 上一步</button>${s < 5 ? `<button class="btn primary" id="next">下一步 ${icon('arrow-right')}</button>` : (state.submitted ? `<a class="btn primary" href="assets.html?status=all">${icon('server')} 前往资产列表</a>` : `<button class="btn primary" id="submit">${icon('check')} 提交接入</button>`)}</div></div>
      </div>
      <div class="stack">
        <div class="card"><div class="card-head"><h3>接入摘要</h3></div><div class="card-body"><dl class="kv"><dt>租户</dt><dd>${esc(tenant.name)} <span class="faint">· ${tenant.isolation === 'dedicated' ? '独享池' : '共享池'} ${tenant.pool}</span></dd><dt>CMDB</dt><dd class="mono">${esc(f.cmdb)}</dd><dt>资产</dt><dd><b>${esc(f.name)}</b> <span class="mono muted">${esc(f.ip)}</span></dd><dt>类型 / 站点</dt><dd>${App.typeName(f.type)} · ${esc(f.site)}</dd><dt>技术主机名</dt><dd class="mono">${tenant.id.replace('t-', '')}.${esc(f.site.slice(0, 2))}.${esc(f.name)}</dd><dt>主机组</dt><dd class="mono">tenant/${tenant.id.replace('t-', '')}/${esc(f.site)}</dd><dt>Proxy</dt><dd class="mono">${esc(f.proxy || '—')}</dd><dt>模板</dt><dd>${esc((DATA.templates.find(t => t.id === f.template) || {}).name || '—')}</dd><dt>预估 Item</dt><dd>${(DATA.templates.find(t => t.id === f.template) || { items: 0 }).items} 个 · ≈ ${((DATA.templates.find(t => t.id === f.template) || { items: 0 }).items / +f.interval).toFixed(2)} NVPS</dd></dl>
          <div class="mt12"><div class="row between xs muted mb8"><span>租户资产配额</span><span>${tenant.assets + 1} / ${tenant.quota.assets}</span></div>${App.meter((tenant.assets + 1) / tenant.quota.assets * 100)}</div>
          <div class="mt8"><div class="row between xs muted mb8"><span>租户 NVPS 配额</span><span>${tenant.nvps} / ${tenant.quota.nvps}</span></div>${App.meter(tenant.nvps / tenant.quota.nvps * 100)}</div>
        </div></div>
        <div class="card"><div class="card-head"><h3>接入中 / 待处理 <span class="badge neutral">${pending.length}</span></h3><a class="small" href="assets.html">全部</a></div><div class="card-body tight">${pending.map(a => `<div class="row" style="padding:8px 18px;border-bottom:1px dashed var(--line);gap:10px;cursor:pointer" onclick="location.href='asset-detail.html?id=${a.id}'">${App.typeIcon(a.type)}<div class="grow"><div class="small strong">${esc(a.name)}</div><div class="xs muted">${esc(a.site)} · ${fmt.ago(a.created)}${a.syncError ? ' · ' + esc(a.syncError) : ''}</div></div>${App.syncBadge(a.sync)}</div>`).join('') || '<div class="empty small">无</div>'}</div></div>
        <div class="callout neutral">${icon('info')}<div><b>网络原则</b>：客户侧主动 Proxy 经 TLS 连接监控端点；Agent 主动检查连接 Proxy（TCP 10051），被动检查按需开放 TCP 10050；SNMP 轮询 UDP 161、Trap UDP 162。密钥按客户 / 站点隔离。</div></div>
      </div>
    </div>`;
    const body = document.getElementById('stepBody');
    if (s === 1) body.innerHTML = `<div class="form-grid">
      <div class="field"><label>CMDB 配置项 <span class="req">*</span></label><div class="row"><input class="input" id="f-cmdb" value="${esc(f.cmdb)}"><button class="btn" id="cmdbSearch">${icon('search')} 查找</button></div><div class="hint">从 CMDB 选择配置项，平台只保存映射；IP 不作为唯一键</div></div>
      <div class="field"><label>资产类型 <span class="req">*</span></label><select class="select" id="f-type">${Object.entries(App.TYPES).map(([k, v]) => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${v.name}</option>`).join('')}</select></div>
      <div class="field"><label>资产名称 <span class="req">*</span></label><input class="input" id="f-name" value="${esc(f.name)}"><div class="err">名称不能为空且需在租户内唯一</div></div>
      <div class="field"><label>IP / 地址 <span class="req">*</span></label><input class="input" id="f-ip" value="${esc(f.ip)}"><div class="err">请输入合法 IP 或域名</div></div>
      <div class="field"><label>租户</label><input class="input" readonly value="${esc(tenant.name)}（由登录上下文解析，不可编辑）"></div>
      <div class="field"><label>站点 <span class="req">*</span></label><select class="select" id="f-site">${sites.map(x => `<option ${f.site === x.name ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label>负责人</label><select class="select" id="f-owner">${['陈立', '王芸', '孙浩', '李梦'].map(o => `<option ${f.owner === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>服务关系（业务系统）</label><select class="select" id="f-service">${DATA.slaServices.filter(x => x.tenant === tenant.id).map(x => `<option ${f.service === x.name ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select><div class="hint">用于 SLA 服务树、事件相关性与看板分组</div></div>
      <div class="field full"><label>标签</label><input class="input" id="f-tags" value="${esc(f.tags)}"><div class="hint">标签仅用于路由与检索，不作为授权依据</div></div>
    </div>`;
    if (s === 2) { const px = DATA.proxies.filter(p => p.tenant === tenant.id && p.site === f.site); if (!f.proxy && px[0]) f.proxy = px[0].group ? px[0].group + '（Proxy Group）' : px[0].id; body.innerHTML = `<div class="form-grid">
      <div class="field full"><label>网络检查</label><div class="row"><button class="btn" id="netcheck">${icon('activity')} 从站点 Proxy 发起连通性检查</button><span class="small muted">检查 ICMP、目标端口与 TLS 握手；结果决定采集方式（主动 / 被动）</span></div><div id="netResult" class="mt8"></div></div>
      <div class="field"><label>Proxy 绑定 <span class="req">*</span></label><select class="select" id="f-proxy">${[...new Set(px.map(p => p.group ? p.group + '（Proxy Group）' : p.id))].map(p => `<option ${f.proxy === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}${px.length ? '' : '<option>（该站点尚无 Proxy，需先部署）</option>'}</select><div class="hint">Proxy Group 按主机重分配实现故障转移；不支持 SNMP Trap</div></div>
      <div class="field"><label>采集方式</label><select class="select"><option>Zabbix agent 2 · 主动检查（受限网络推荐）</option><option>Zabbix agent 2 · 被动检查</option><option>SNMPv3</option><option>HTTP / Web 场景</option><option>受控 Sender / Trapper</option></select></div>
      <div class="field"><label>凭据 <span class="req">*</span></label><select class="select" id="f-cred"><option value="psk" ${f.cred === 'psk' ? 'selected' : ''}>TLS PSK · 站点级密钥（自动签发）</option><option value="cert" ${f.cred === 'cert' ? 'selected' : ''}>TLS 证书 · 租户 CA</option><option value="snmp">SNMPv3 authPriv · 租户凭据库</option></select><div class="hint">凭据按租户 / 站点存储于服务端密钥库，不进入浏览器、日志与报告</div></div>
      <div class="field"><label>接口端口</label><input class="input" id="f-port" value="${esc(f.port)}"></div>
      <div class="field full"><label class="check"><input type="checkbox" checked> 预登记主机身份（Agent 自动注册时进入待认领区，经资产校验后接入）</label></div>
    </div>`; }
    if (s === 3) { const tpls = DATA.templates.filter(t => t.status !== 'draft'); const tp = DATA.templates.find(t => t.id === f.template) || tpls[0]; body.innerHTML = `<div class="form-grid">
      <div class="field full"><label>模板（分层：基础设施 → 中间件 → 业务服务）<span class="req">*</span></label><select class="select" id="f-template">${['infra', 'middleware', 'business'].map(l => `<optgroup label="${DATA.LAYERS[l]}">${tpls.filter(t => t.layer === l).map(t => `<option value="${t.id}" ${f.template === t.id ? 'selected' : ''}>${esc(t.name)} · v${t.version}${t.status === 'canary' ? '（灰度 ' + t.canary + '%）' : ''}</option>`).join('')}</optgroup>`).join('')}</select><div class="hint">共享基础模板仅平台发布；租户差异通过受控宏与覆盖参数表达。当前版本 v${tp.version} · ${tp.items} 项 · ${tp.triggers} 触发器 · LLD 上限 ${tp.lldLimit}</div></div>
      <div class="field"><label>采样周期（秒）</label><select class="select" id="f-interval">${['30', '60', '120', '300'].map(v => `<option ${f.interval === v ? 'selected' : ''}>${v}</option>`).join('')}</select><div class="hint">影响 NVPS 与存储；金融等高频需求需评估配额</div></div>
      <div class="field"><label>发现规则资源上限</label><input class="input" value="${tp.lldLimit} 个 Item / 规则" readonly><div class="hint">避免 LLD 一次生成大量 Item / Trigger</div></div>
      <div class="field full"><label>宏与阈值覆盖</label><table class="table dense"><thead><tr><th>宏</th><th>模板默认</th><th>租户覆盖</th><th>说明</th></tr></thead><tbody>${tp.macros.slice(0, 5).map(m => `<tr><td class="mono">${esc(m.m)}</td><td class="mono muted">${esc(m.v)}</td><td><input class="input sm mono" data-macro="${esc(m.m)}" value="${esc(f.macros[m.m] ?? '')}" placeholder="继承默认" style="width:120px"></td><td class="small muted">${esc(m.d)}</td></tr>`).join('')}</tbody></table></div>
    </div>`; }
    if (s === 4) body.innerHTML = `<div class="row between mb"><div><h3 style="font-size:14px">首值验证</h3><div class="small muted">Agent 可达、Item 有效、触发器正常。验证不通过可返回修改，不会阻断登记。</div></div><button class="btn primary" id="verify">${icon('play')} 开始验证</button></div><div id="verifyBody">${state.verify ? verifyHtml() : `<div class="empty">${icon('activity')}<div>尚未开始验证。点击「开始验证」将向 Proxy 下发临时配置并等待首个采集周期。</div></div>`}</div>`;
    if (s === 5) body.innerHTML = state.submitted ? `<div class="callout ok mb">${icon('check-circle')}<div><b>已接受接入请求</b> · 202 Accepted · operation_id <span class="mono">${state.submitted}</span><br>Worker 正在按租户路由调用 ${tenant.pool} 的 Zabbix API（host.create → 模板绑定 → 回读）。前端状态：<span class="badge sync"><span class="dot sync"></span>同步中</span> → 生效 / 失败。</div></div><div class="timeline">${[['已写入平台业务事务与 Outbox（同一事务提交）', 'ok'], ['Worker 领取任务，幂等键 ' + tenant.id + ':' + f.name, 'ok'], ['调用 host.create（结果未知时先按技术主机名回读，再决定重试）', 'info'], ['绑定模板版本并回读配置摘要', ''], ['进入服务：计量、告警分派、SLA 映射生效', '']].map(x => `<div class="tl-item ${x[1]}"><span class="tl-dot"></span><div class="tl-title small">${x[0]}</div></div>`).join('')}</div>` : `<div class="form-grid">
      <div class="field"><label>计量</label><input class="input" readonly value="${(DATA.templates.find(t => t.id === f.template) || { items: 0 }).items} Item · ≈ ${((DATA.templates.find(t => t.id === f.template) || { items: 0 }).items / +f.interval).toFixed(2)} NVPS · 历史 ${tenant.retention.history} 天 / 趋势 ${tenant.retention.trends} 天"><div class="hint">用于运营计量，不直接等同收费</div></div>
      <div class="field"><label>告警分派（升级策略）</label><select class="select" id="f-esc">${DATA.escalations.map(e => `<option ${e.tenants.includes(tenant.id) ? 'selected' : ''}>${e.tier} · ${e.steps.map(x => x.who).join(' → ')}</option>`).join('')}</select></div>
      <div class="field"><label>SLA 服务映射</label><select class="select" id="f-sla">${DATA.slaServices.filter(x => x.tenant === tenant.id).map(x => `<option ${f.service === x.name ? 'selected' : ''}>${esc(x.name)} · 目标 ${x.target}%</option>`).join('')}</select></div>
      <div class="field"><label>通知渠道</label><div class="row wrap" style="gap:8px;margin-top:4px">${['钉钉', '邮件', '短信（严重+）', '电话（灾难）'].map((c, i) => `<label class="check"><input type="checkbox" ${i < 3 ? 'checked' : ''}> ${c}</label>`).join('')}</div></div>
      <div class="field full"><div class="callout info">${icon('info')}<div>提交后将以 <b>tenant_id + Idempotency-Key</b> 创建资产并异步接入；同一幂等键不同请求体返回冲突。调用超时视为「结果未知」，先按稳定技术名称回读再决定重试，避免重复创建。</div></div></div>
    </div>`;
    bind();
  }
  function verifyHtml() { const v = state.verify; return `<div class="stack" style="gap:8px">${v.map(x => `<div class="runstep ${x.st}"><span class="rs-i">${x.st === 'done' ? icon('check') : x.st === 'fail' ? '!' : x.st === 'run' ? '' : '·'}</span><div class="grow"><div class="small strong">${x.name}</div><div class="xs muted">${x.desc}</div></div>${x.st === 'run' ? '<span class="spin"></span>' : x.st === 'warn' ? App.badge('warn', '警告') : x.st === 'done' ? App.badge('ok', '通过') : x.st === 'fail' ? App.badge('danger', '失败') : ''}</div>`).join('')}</div>`; }
  function bind() {
    const f = state.form; const s = state.step;
    const g = (id) => document.getElementById(id);
    if (g('prev')) g('prev').onclick = () => { state.step--; render(); };
    if (g('next')) g('next').onclick = () => { if (s === 1) { const name = g('f-name').value.trim(), ip = g('f-ip').value.trim(); let ok = true; g('f-name').closest('.field').classList.toggle('invalid', !name); g('f-ip').closest('.field').classList.toggle('invalid', !/^([\d.]+|[\w.-]+\.[a-z]{2,})$/i.test(ip)); if (!name || !/^([\d.]+|[\w.-]+\.[a-z]{2,})$/i.test(ip)) return App.toast('请修正表单中的错误', 'danger'); Object.assign(f, { cmdb: g('f-cmdb').value, type: g('f-type').value, name, ip, site: g('f-site').value, owner: g('f-owner').value, service: g('f-service').value, tags: g('f-tags').value }); f.proxy = ''; } if (s === 2) { Object.assign(f, { proxy: g('f-proxy').value, cred: g('f-cred').value, port: g('f-port').value }); if (!state.netcheck) App.toast('提示：尚未执行网络检查，将在首值验证阶段再次检测', 'warn'); } if (s === 3) { f.template = g('f-template').value; f.interval = g('f-interval').value; App.$$('[data-macro]').forEach(i => { if (i.value) f.macros[i.dataset.macro] = i.value; else delete f.macros[i.dataset.macro]; }); } if (s === 4 && !state.verify) return App.toast('请先完成首值验证', 'warn'); state.step++; render(); };
    if (g('cmdbSearch')) g('cmdbSearch').onclick = () => App.modal({ title: '从 CMDB 选择配置项', body: `<div class="search-box mb" style="position:relative">${icon('search')}<input class="input" style="padding-left:30px" placeholder="搜索 CI 名称 / 编号 / IP" value="erp"></div><table class="table dense"><thead><tr><th>CI</th><th>名称</th><th>IP</th><th>状态</th><th></th></tr></thead><tbody>${[['CI-20431', 'srv-erp-app-03', '10.10.20.13', '待上线'], ['CI-20432', 'srv-erp-app-04', '10.10.20.14', '待上线'], ['CI-20011', 'srv-erp-app-01', '10.10.20.11', '已接入']].map(r => `<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td class="mono">${r[2]}</td><td>${r[3] === '已接入' ? App.badge('ok', r[3]) : App.badge('neutral', r[3])}</td><td>${r[3] === '已接入' ? '' : `<button class="btn xs primary" onclick="(function(){document.getElementById('f-cmdb').value='${r[0]}';document.getElementById('f-name').value='${r[1]}';document.getElementById('f-ip').value='${r[2]}';App.closeLayer();App.toast('已从 CMDB 带入配置项','ok',1500)})()">选择</button>`}</td></tr>`).join('')}</tbody></table>` });
    if (g('f-template')) g('f-template').onchange = (e) => { f.template = e.target.value; render(); };
    if (g('netcheck')) g('netcheck').onclick = () => { const r = g('netResult'); r.innerHTML = `<div class="row small muted"><span class="spin"></span> 正在从 ${esc(f.proxy || '站点 Proxy')} 发起检查…</div>`; setTimeout(() => { state.netcheck = true; r.innerHTML = `<div class="grid g4" style="gap:8px">${[['ICMP', '可达 · RTT 0.8 ms', 'ok'], ['TCP ' + f.port, f.type === 'switch' ? '不适用（SNMP UDP 161 可达）' : '开放（被动检查可用）', 'ok'], ['出向 10051', 'Agent → Proxy 可达（主动检查可用）', 'ok'], ['TLS 握手', f.cred === 'psk' ? 'PSK 协商成功' : '证书链有效', 'ok']].map(x => `<div class="status-cell ${x[2]}"><div class="sc-head"><span>${x[0]}</span>${App.badge('ok', '通过')}</div><div class="xs muted">${x[1]}</div></div>`).join('')}</div>`; App.toast('网络检查通过，建议采集方式：主动检查', 'ok'); }, 1200); };
    if (g('verify')) g('verify').onclick = () => { const seq = [['Agent 可达', 'agent.ping 返回 1 · 版本 7.0.13 · 主机名匹配预登记'], ['首个采集周期', '等待 60 s 采样周期内到达的值'], ['Item 有效性', '148 / 150 有效；2 个不支持：systemd.unit.info[node_exporter.service]（服务不存在）、vfs.fs.inode[/boot,pused]（只读文件系统）'], ['触发器状态', '36 个触发器全部计算正常，无立即触发'], ['依赖与阈值', '模板宏覆盖已生效：{$CPU.UTIL.CRIT}=80']]; state.verify = seq.map(x => ({ name: x[0], desc: x[1], st: 'wait' })); const body = g('verifyBody'); const tick = (i) => { if (i >= seq.length) { App.toast('首值验证完成：2 个警告，可进入服务', 'ok'); return; } state.verify[i].st = 'run'; body.innerHTML = verifyHtml(); setTimeout(() => { state.verify[i].st = i === 2 ? 'warn' : 'done'; body.innerHTML = verifyHtml(); tick(i + 1); }, i === 1 ? 1400 : 700); }; tick(0); };
    if (g('submit')) g('submit').onclick = () => { state.submitted = 'op-' + App.uid() + App.uid(); App.toast('接入请求已接受（202），进入同步中', 'ok'); DATA.assets.push(Object.assign({}, DATA.assets[0], { id: 'a-new-' + App.uid(), tenant: tenant.id, site: f.site, type: f.type, name: f.name, ip: f.ip, status: 'ok', sync: 'syncing', problems: {}, tags: f.tags.split(/,\s*/).filter(Boolean), created: DATA.now, lastData: DATA.now, service: f.service, owner: f.owner })); render(); };
    if (g('bulkImport')) g('bulkImport').onclick = () => App.modal({ title: '批量导入', body: `<div class="stack" style="gap:12px"><div class="callout info">${icon('info')}<div>支持 CSV 模板或 CMDB 同步。批量请求逐项授权；对象不存在与无权限统一响应。每批最多 500 个对象。</div></div><div class="field"><label>来源</label><select class="select"><option>CMDB 同步（按服务关系筛选）</option><option>上传 CSV</option></select></div><div class="field"><label>默认模板 / 站点</label><input class="input" value="Linux by Zabbix agent 2 (MSP 基线) · 上海总部"></div></div>`, foot: `<button class="btn" data-close>取消</button><button class="btn primary" onclick="App.toast('已创建批量接入任务（48 个对象），可在资产列表按同步状态筛选','ok');App.closeLayer()">开始导入</button>` });
    if (g('autoReg')) g('autoReg').onclick = () => App.modal({ title: '自动注册待认领区', sub: '未知 Agent 自动注册先进入待认领区，经资产校验后接入', size: 'lg', body: `<table class="table dense"><thead><tr><th>Agent 主机名</th><th>来源 IP</th><th>Proxy</th><th>首次出现</th><th>元数据</th><th></th></tr></thead><tbody>${[['huadong.sh.srv-erp-app-03', '10.10.20.13', 'px-sh-01', '12 分钟前', 'os=rocky9 role=erp-app'], ['unknown-7f3a', '10.20.40.77', 'px-sz-01', '2 小时前', '（无）'], ['xingchen.hz.pos-gw-03', '10.30.20.13', 'px-hz-01', '1 天前', 'os=rocky9 role=pos']].map(r => `<tr><td class="mono">${r[0]}</td><td class="mono">${r[1]}</td><td class="mono">${r[2]}</td><td>${r[3]}</td><td class="xs muted">${r[4]}</td><td><button class="btn xs primary" onclick="App.toast('已认领并带入接入向导','ok');App.closeLayer()">认领</button> <button class="btn xs" onclick="App.toast('已忽略','info')">忽略</button></td></tr>`).join('')}</tbody></table>` });
  }
  render();
});
</script>
